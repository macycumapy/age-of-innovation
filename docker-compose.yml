services:
    app:
        build:
            context: ./docker/php/8.5
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: sail-8.5/app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            - '${VITE_PORT:-5173}:${VITE_PORT:-5173}'
        expose:
            - '9000'
            - '9001'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            PHP_IDE_CONFIG: 'serverName=age-of-innovation'
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            XDEBUG_CONFIG: '${SAIL_XDEBUG_CONFIG:-client_host=host.docker.internal}'
            SUPERVISOR_PHP_COMMAND: '/usr/sbin/php-fpm8.5 --nodaemonize'
            SUPERVISOR_PHP_USER: 'root'
        volumes:
            - '.:/var/www/html'
            - './docker/php/8.5/www.conf:/etc/php/8.5/fpm/pool.d/www.conf:ro'
        networks:
            - sail
        depends_on:
            - mysql
            - redis
    nginx:
        image: nginx:alpine
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        volumes:
            - './public:/var/www/html/public:ro'
            - './docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro'
        networks:
            - sail
        depends_on:
            app:
                condition: service_started
            mcp:
                condition: service_healthy
    mcp:
        image: sail-8.5/app
        restart: unless-stopped
        command: php artisan game:mcp-serve
        expose:
            - '8090'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            app:
                condition: service_started
            redis:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:8090/health']
            interval: 5s
            timeout: 2s
            retries: 5
    mysql:
        image: 'mysql:latest'
        container_name: '${APP_NAME}_mysql'
        restart: unless-stopped
        tty: true
        ports:
            - '${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'sail-mysql:/var/lib/mysql'
        networks:
            - sail
    mysql_test:
      profiles:
        - dev
      image: 'mysql:latest'
      container_name: '${APP_NAME}_mysql_test'
      tty: true
      ports:
        - '${FORWARD_DB_PORT_TEST:-3308}:3306'
      environment:
        MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
        MYSQL_DATABASE: '${DB_TESTING_DATABASE:-testing}'
        MYSQL_USER: '${DB_USERNAME}'
        MYSQL_PASSWORD: '${DB_PASSWORD}'
      volumes:
        - './docker/databases/${DB_TESTING_DATABASE:-testing}:/var/lib/mysql'
      networks:
        - sail
    redis:
        image: 'redis:alpine'
        ports:
            - '${FORWARD_REDIS_PORT:-6379}:6379'
        volumes:
            - 'sail-redis:/data'
        networks:
            - sail
        healthcheck:
            test:
                - CMD
                - redis-cli
                - ping
            retries: 3
            timeout: 5s
    horizon:
        image: sail-8.5/app
        restart: unless-stopped
        command: php artisan horizon
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
            mysql:
                condition: service_started
    reverb:
        image: sail-8.5/app
        restart: unless-stopped
        command: php artisan reverb:start --host=0.0.0.0 --port=8080
        ports:
            - '${REVERB_SERVER_PORT:-8080}:8080'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
        volumes:
            - '.:/var/www/html'
        networks:
            - sail
        depends_on:
            redis:
                condition: service_healthy
networks:
    sail:
        driver: bridge
volumes:
    sail-mysql:
        driver: local
    sail-redis:
        driver: local
