name: CD
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: public/build

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: public/build
          target: ${{ vars.PROJECT_FOLDER }}/.deploy/${{ github.event.workflow_run.id }}

      - name: Run command on remote server
        uses: D3rHase/ssh-command-action@v0.2.2
        with:
          host: ${{vars.SSH_HOST}}
          user: ${{vars.SSH_USER}}
          private_key: ${{secrets.SSH_PRIVATE_KEY}}
          command: |
            set -eu
            cd "${{ vars.PROJECT_FOLDER }}"
            git fetch origin main
            git merge --ff-only "${{ github.event.workflow_run.head_sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.event.workflow_run.head_sha }}"
            bash ./deploy.sh ".deploy/${{ github.event.workflow_run.id }}/public/build"
