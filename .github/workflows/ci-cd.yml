name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  prepare-image:
    name: Prepare application image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      available: ${{ steps.cached-image.outputs.found == 'true' || steps.publish.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v5

      - name: Determine application image
        id: image
        env:
          IMAGE_HASH: ${{ hashFiles('docker/php/8.5/**') }}
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-ci:php85-${IMAGE_HASH}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check application image availability
        id: cached-image
        env:
          IMAGE_NAME: ${{ steps.image.outputs.name }}
        run: |
          if docker manifest inspect "$IMAGE_NAME" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.cached-image.outputs.found != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/setup-buildx-action@v3

      - name: Publish missing application image
        id: publish
        if: steps.cached-image.outputs.found != 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php/8.5
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            WWWGROUP=1000
          cache-from: type=gha,scope=sail-php85
          cache-to: type=gha,scope=sail-php85,mode=max

  test-build:
    needs: prepare-image
    name: Build and test application
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      APP_SERVICE: app
    steps:
      - uses: actions/checkout@v5

      - name: Match Sail user to runner permissions
        run: |
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          APP_NAME=ci
          APP_ENV=testing
          APP_SERVICE=app
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=testing
          DB_USERNAME=sail
          DB_PASSWORD=password
          ENV

      - name: Log in to GHCR
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download prepared application image
        if: needs.prepare-image.outputs.available == 'true'
        env:
          IMAGE_NAME: ${{ needs.prepare-image.outputs.image }}
        run: |
          docker pull "$IMAGE_NAME"
          docker tag "$IMAGE_NAME" sail-8.5/app:latest

      - name: Set up Docker Buildx for local image
        if: needs.prepare-image.outputs.available != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Build local image for pull request
        if: needs.prepare-image.outputs.available != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php/8.5
          load: true
          push: false
          tags: sail-8.5/app:latest
          build-args: |
            WWWGROUP=1000
          cache-from: type=gha,scope=sail-php85

      - name: Install dependencies and bootstrap Sail
        run: >-
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)"
          -e COMPOSER_HOME=/tmp/composer app
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Start application services
        run: vendor/bin/sail up -d app mysql redis

      - name: Verify application write permissions
        run: >-
          vendor/bin/sail exec -T --user sail app sh -c
          'test -w .env && test -w storage && test -w storage/logs && test -w bootstrap/cache'

      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 60); do
            if vendor/bin/sail exec -T mysql mysql -h 127.0.0.1 -usail -ppassword testing -e 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Prepare application
        run: |
          vendor/bin/sail artisan key:generate --no-interaction
          vendor/bin/sail artisan config:clear --no-interaction
          vendor/bin/sail composer check-platform-reqs

      - name: Build frontend and generate route types
        run: |
          vendor/bin/sail npm ci --include=dev
          vendor/bin/sail npm run build

      - name: Check frontend lint, formatting and types
        run: |
          vendor/bin/sail npm run lint:check
          vendor/bin/sail npm run format:check
          vendor/bin/sail npm run types:check

      - name: Run frontend and deployment tests
        run: vendor/bin/sail exec -T app sh -c 'node --test tests/ci.test.mjs tests/deploy.test.mjs $(find tests/Frontend -type f -name "*.test.mjs")'

      - name: Check PHP formatting and static analysis
        run: |
          vendor/bin/sail composer lint:check
          vendor/bin/sail composer analyse

      - name: Run PHP tests
        run: vendor/bin/sail artisan test --compact

      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down --volumes

  deploy:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    concurrency:
      group: production-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download frontend build
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: public/build

      - name: Copy frontend build to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.SSH_HOST }}
          username: ${{ vars.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: public/build
          target: ${{ vars.PROJECT_FOLDER }}/.deploy/${{ github.run_id }}

      - name: Run command on remote server
        uses: D3rHase/ssh-command-action@v0.2.2
        with:
          host: ${{vars.SSH_HOST}}
          user: ${{vars.SSH_USER}}
          private_key: ${{secrets.SSH_PRIVATE_KEY}}
          command: |
            set -eu
            cd "${{ vars.PROJECT_FOLDER }}"
            git fetch origin main
            git merge --ff-only "${{ github.sha }}"
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            bash ./deploy.sh ".deploy/${{ github.run_id }}/public/build"
