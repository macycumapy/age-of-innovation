name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-build:
    name: Build and test application
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      APP_SERVICE: app
    steps:
      - uses: actions/checkout@v5

      - name: Match Sail user to runner permissions
        run: |
          echo "WWWUSER=$(id -u)" >> "$GITHUB_ENV"
          echo "WWWGROUP=$(id -g)" >> "$GITHUB_ENV"

      - name: Prepare CI environment
        run: |
          cp .env.example .env
          cat >> .env <<'ENV'
          APP_NAME=ci
          APP_ENV=testing
          APP_SERVICE=app
          DB_CONNECTION=mysql
          DB_HOST=mysql
          DB_PORT=3306
          DB_DATABASE=testing
          DB_USERNAME=sail
          DB_PASSWORD=password
          ENV

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download application image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}-ci:php85"
          docker pull "$image"
          docker tag "$image" sail-8.5/app:latest

      - name: Install dependencies and bootstrap Sail
        run: >-
          docker compose run --rm --no-deps --user "$(id -u):$(id -g)"
          -e COMPOSER_HOME=/tmp/composer app
          composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Start application services
        run: vendor/bin/sail up -d app mysql redis

      - name: Verify application write permissions
        run: >-
          vendor/bin/sail exec -T --user sail app sh -c
          'test -w .env && test -w storage && test -w storage/logs && test -w bootstrap/cache'

      - name: Wait for MySQL
        run: |
          for attempt in $(seq 1 60); do
            if vendor/bin/sail exec -T mysql mysql -h 127.0.0.1 -usail -ppassword testing -e 'SELECT 1'; then
              exit 0
            fi
            sleep 2
          done
          exit 1

      - name: Prepare application
        run: |
          vendor/bin/sail artisan key:generate --no-interaction
          vendor/bin/sail artisan config:clear --no-interaction
          vendor/bin/sail composer check-platform-reqs

      - name: Build frontend and generate route types
        run: |
          vendor/bin/sail npm ci --include=dev
          vendor/bin/sail npm run build

      - name: Check frontend lint, formatting and types
        run: |
          vendor/bin/sail npm run lint:check
          vendor/bin/sail npm run format:check
          vendor/bin/sail npm run types:check

      - name: Run frontend and deployment tests
        run: vendor/bin/sail exec -T app sh -c 'node --test tests/ci.test.mjs tests/deploy.test.mjs $(find tests/Frontend -type f -name "*.test.mjs")'

      - name: Check PHP formatting and static analysis
        run: |
          vendor/bin/sail composer lint:check
          vendor/bin/sail composer analyse

      - name: Run PHP tests
        run: vendor/bin/sail artisan test --compact

      - name: Upload frontend build
        uses: actions/upload-artifact@v6
        with:
          name: frontend-build
          path: public/build
          if-no-files-found: error
          retention-days: 7

      - name: Show container logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
