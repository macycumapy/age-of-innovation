name: Publish CI image
on:
  push:
    branches: [main]
    paths:
      - docker/php/8.5/**
      - .github/workflows/ci-image.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-ci-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Determine image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}-ci:php85" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish application image
        uses: docker/build-push-action@v7
        with:
          context: ./docker/php/8.5
          push: true
          tags: ${{ steps.image.outputs.name }}
          build-args: |
            WWWGROUP=1000
          cache-from: type=gha,scope=sail-php85
          cache-to: type=gha,scope=sail-php85,mode=max
