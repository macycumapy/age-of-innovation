[www]
user = sail
group = sail
listen = 0.0.0.0:9000

pm = dynamic
pm.max_children = 4
pm.start_servers = 1
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500

clear_env = no
catch_workers_output = yes
decorate_workers_output = no

